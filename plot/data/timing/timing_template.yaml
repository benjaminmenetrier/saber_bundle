geometry:
  function space: StructuredColumns
  grid:
    type: octahedral_gaussian
    N: __N__
  groups:
  - variables:
    - air_temperature
  interpolation:
    interpolation type: atlas interpolation wrapper
background:
  date: 2025-08-04T00:00:00Z
  state variables:
  - air_temperature
background error:
  covariance model: SABER
  saber central block:
    saber block name: BUMP_NICAS
    calibration:
      general:
        testing: true
        default seed: 0
        timers: true
        universe length-scale: __ULS__
      drivers:
        multivariate strategy: univariate
        compute nicas: true
      nicas:
        grid type: __GRID_TYPE__
        resolution: __RESOL__
        explicit length-scales: true
        horizontal length-scale:
        - groups:
          - air_temperature
          value: __RH__
        vertical length-scale:
        - groups:
          - air_temperature
          value: 1.0
        interpolation type:
        - groups:
          - air_temperature
          type: __INTERP__
        smooth interpolation factor: 0.8
        smooth interpolation scaling: true
        setup timings: 10
        application timings: 100
test:
  reference filename: ../timing.ref